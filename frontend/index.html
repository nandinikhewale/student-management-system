<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #fff;
      --ink: #16212e;
      --muted: #5d6b7a;
      --line: #d6dce4;
      --accent: #1f4fd8;
      --danger: #b42318;
      --ok: #157347
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Public Sans", system-ui, sans-serif
    }

    header {
      background: var(--ink);
      color: #fff;
      padding: 20px 24px
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700
    }

    header p {
      margin: 2px 0 0;
      color: #aab6c4;
      font-size: .9rem
    }

    main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px
    }

    @media(max-width:820px) {
      main {
        grid-template-columns: 1fr
      }
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.1rem
    }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 500;
      margin: 10px 0 4px
    }

    input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: inherit
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    button {
      font: inherit;
      font-weight: 500;
      border: 0;
      border-radius: 4px;
      padding: 9px 14px;
      cursor: pointer
    }

    .primary {
      background: var(--accent);
      color: #fff
    }

    .ghost {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink)
    }

    .danger {
      background: #fff;
      border: 1px solid #e8b4af;
      color: var(--danger)
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px
    }

    .bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px
    }

    .wrap {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .92rem
    }

    th,
    td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: .85rem
    }

    td.btns {
      display: flex;
      gap: 6px
    }

    td.btns button {
      padding: 5px 10px;
      font-size: .85rem
    }

    .empty {
      color: var(--muted);
      padding: 24px 0;
      text-align: center
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 4px;
      color: #fff;
      display: none;
      max-width: 90%
    }

    #toast.ok {
      background: var(--ok)
    }

    #toast.err {
      background: var(--danger)
    }
  </style>
</head>

<body>
  <header>
    <h1>Student Records</h1>
    <p>Add, search, update and remove student information</p>
  </header>
  <main>
    <section>
      <h2 id="formTitle">Add student</h2>
      <form id="form">
        <label for="studentId">Student ID</label><input id="studentId" required placeholder="ST101">
        <label for="name">Full name</label><input id="name" required>
        <label for="email">Email</label><input id="email" type="email" required>
        <label for="department">Department</label><input id="department">
        <div class="row">
          <div><label for="semester">Semester</label><input id="semester" type="number" min="1" max="12"></div>
          <div><label for="contact">Contact</label><input id="contact" inputmode="tel"></div>
        </div>
        <div class="actions">
          <button class="primary" id="saveBtn" type="submit">Add student</button>
          <button class="ghost" id="cancelBtn" type="button" hidden>Cancel</button>
        </div>
      </form>
    </section>
    <section>
      <h2>All students</h2>
      <div class="bar">
        <input id="search" type="search" placeholder="Search by name or ID">
        <button class="ghost" id="searchBtn">Search</button>
      </div>
      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Sem</th>
              <th>Contact</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="msg">Loading students. If the server was idle, this can take up to a minute.</div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="config.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const keys = ["studentId", "name", "email", "department", "semester", "contact"];
    let students = [], editingId = null;

    async function api(path = "", opts = {}) {
      const r = await fetch(API_URL + path, { headers: { "Content-Type": "application/json" }, ...opts });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.message || "Something went wrong");
      return d;
    }

    function toast(text, ok = true) {
      const t = $("#toast");
      t.textContent = text; t.className = ok ? "ok" : "err"; t.style.display = "block";
      clearTimeout(t._t); t._t = setTimeout(() => (t.style.display = "none"), 3500);
    }

    async function load() {
      try {
        students = await api("?search=" + encodeURIComponent($("#search").value.trim()));
        render();
      } catch (e) {
        $("#msg").style.display = "block";
        $("#msg").textContent = "Could not reach the server. Check the API address in config.js.";
      }
    }

    function render() {
      const body = $("#rows"); body.innerHTML = "";
      $("#msg").style.display = students.length ? "none" : "block";
      $("#msg").textContent = "No students found. Add one using the form.";
      students.forEach((s, i) => {
        const tr = document.createElement("tr");
        [s.studentId, s.name, s.email, s.department, s.semester, s.contact].forEach((v) => {
          const td = document.createElement("td"); td.textContent = v ?? ""; tr.appendChild(td);
        });
        const td = document.createElement("td"); td.className = "btns";
        const ed = Object.assign(document.createElement("button"), { className: "ghost", textContent: "Edit" });
        const del = Object.assign(document.createElement("button"), { className: "danger", textContent: "Delete" });
        ed.onclick = () => startEdit(i); del.onclick = () => remove(i);
        td.append(ed, del); tr.appendChild(td); body.appendChild(tr);
      });
    }

    function startEdit(i) {
      const s = students[i]; editingId = s._id;
      keys.forEach((k) => ($("#" + k).value = s[k] ?? ""));
      $("#formTitle").textContent = "Edit student"; $("#saveBtn").textContent = "Save changes";
      $("#cancelBtn").hidden = false; $("#studentId").focus();
    }

    function resetForm() {
      editingId = null; $("#form").reset();
      $("#formTitle").textContent = "Add student"; $("#saveBtn").textContent = "Add student";
      $("#cancelBtn").hidden = true;
    }

    async function remove(i) {
      if (!confirm(`Delete ${students[i].name}?`)) return;
      try { toast((await api("/" + students[i]._id, { method: "DELETE" })).message); load(); }
      catch (e) { toast(e.message, false); }
    }

    $("#form").onsubmit = async (e) => {
      e.preventDefault();
      const data = {};
      keys.forEach((k) => { const v = $("#" + k).value.trim(); if (v !== "") data[k] = k === "semester" ? Number(v) : v; });
      try {
        const d = editingId
          ? await api("/" + editingId, { method: "PUT", body: JSON.stringify(data) })
          : await api("", { method: "POST", body: JSON.stringify(data) });
        toast(d.message); resetForm(); load();
      } catch (err) { toast(err.message, false); }
    };
    $("#cancelBtn").onclick = resetForm;
    $("#searchBtn").onclick = load;
    $("#search").onkeydown = (e) => { if (e.key === "Enter") load(); };
    load();
  </script>
</body>

</html>
